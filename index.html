<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aaron's place</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 84 130%27%3E%3Cpath fill=%27%23F2A33A%27 d=%27M42 4c-21 0-36 16-36 36 0 13 7 21 13 29 5 7 7 12 7 20h32c0-8 2-13 7-20 6-8 13-16 13-29C78 20 63 4 42 4z%27/%3E%3Crect fill=%27%23B8A58A%27 x=%2727%27 y=%2790%27 width=%2730%27 height=%2730%27 rx=%274%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ---------- tokens ---------- */
:root{
  --bg:#0E1424; --bg-2:#111a2e; --ink:#C9D2E6; --mute:#6F7B98; --line:#263352;
  --glow:#F2A33A; --glow-soft:rgba(242,163,58,0); --sleeve-sat:28%; --sleeve-lum:26%;
  --t:1.4s;
  --display:"Bodoni Moda",Georgia,serif; --text:"Jost",system-ui,sans-serif;
}
html.lit{
  --bg:#20110c; --bg-2:#2c1710; --ink:#F6E7CF; --mute:#B08A62; --line:#4a2a1c;
  --glow-soft:rgba(242,163,58,.32); --sleeve-sat:34%; --sleeve-lum:33%;
}
@media (prefers-reduced-motion:reduce){ :root{ --t:0s } }

/* ---------- base ---------- */
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);transition:background-color var(--t),color var(--t)}
body{margin:0;font-family:var(--text);font-weight:400;font-size:17px;line-height:1.6;letter-spacing:.005em;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 55% at 50% -4%,var(--glow-soft),transparent 70%);
  transition:background var(--t)}
a{color:inherit;text-decoration-color:var(--mute);text-underline-offset:.18em}
a:hover{text-decoration-color:var(--glow)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:4px;border-radius:2px}
main{position:relative;z-index:1}
.prose{max-width:62ch}
h1{font-family:var(--display);font-size:clamp(32px,3.6vw,50px);font-weight:400;line-height:1;margin:0 0 10px;letter-spacing:.005em}
h2{font-family:var(--display);font-size:clamp(26px,3vw,36px);font-weight:400;line-height:1.1;margin:0 0 10px}
p{margin:0 0 1em}
.mute{color:var(--mute);transition:color var(--t)}
section{margin-top:clamp(72px,10vw,128px)}
.lede{font-size:clamp(22px,2.6vw,28px);line-height:1.3;font-style:italic}

/* ---------- lamp ---------- */
.ceiling{display:none}
.lamp{display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;
  animation:sway 6s ease-in-out infinite;border-radius:40px}
.lamp:hover{animation-play-state:paused}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@media (prefers-reduced-motion:reduce){.lamp{animation:none}}
.cord{width:2px;height:clamp(90px,16vh,150px);background:var(--mute);transition:background var(--t)}
.bulb{width:84px;height:auto;display:block;overflow:visible}
#scene .glass,.bulb .glass{fill:rgba(255,255,255,.04);stroke:var(--mute);stroke-width:1.6;transition:stroke var(--t),fill var(--t)}
#scene .base,.bulb .base{fill:var(--mute);transition:fill var(--t)}
#scene .fil,.bulb .fil{fill:none;stroke:var(--mute);stroke-width:1.6;stroke-linecap:round;transition:stroke var(--t)}
#scene .halo,.bulb .halo{fill:var(--glow);opacity:0;filter:url(#blur);transition:opacity var(--t)}
html.lit #scene .glass,.bulb .glass{stroke:#FFD79A;fill:rgba(255,205,120,.18)}
html.lit #scene .fil,.bulb .fil{stroke:#FFE7B8;filter:drop-shadow(0 0 6px #FFC46B)}
html.lit #scene .base,.bulb .base{fill:#B8A58A}
html.lit #scene .halo,.bulb .halo{opacity:.5}
html.lit .cord{background:#8C7A62}
.lamp .hint{margin-top:14px;font-style:italic;color:var(--mute);font-size:15px;transition:color var(--t),opacity var(--t)}
html.lit .lamp .hint{opacity:.55}

/* ---------- head ---------- */
.head{margin-top:36px}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px;font-style:italic}

/* ---------- crate ---------- */
.crate{display:flex;align-items:flex-end;padding:28px 18px 0 32px;overflow-x:auto;scrollbar-width:thin;
  border-bottom:8px solid var(--line);border-left:8px solid var(--line);border-right:8px solid var(--line);
  transition:border-color var(--t)}
.sleeve{flex:0 0 auto;width:176px;height:176px;margin-left:-30px;position:relative;transform:rotate(var(--r,0deg));border-radius:4px;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),margin .35s;transform-origin:50% 100%;
  background:hsl(var(--h) var(--sleeve-sat) var(--sleeve-lum));box-shadow:-6px 0 14px rgba(0,0,0,.35);
  display:flex;flex-direction:column;justify-content:flex-end;padding:14px;text-align:left;border-radius:2px;
  background-size:cover;background-position:center}
.sleeve:first-child{margin-left:0}
.sleeve::after{content:"";position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 45%,rgba(0,0,0,.25))}
.sleeve .t{font-size:19px;line-height:1.15;position:relative;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.sleeve .b{font-size:13px;font-style:italic;opacity:.8;position:relative;z-index:1}
.sleeve:hover,.sleeve:focus-visible{transform:translateY(-16px) rotate(var(--r,0deg))}
.sleeve[aria-pressed="true"]{transform:translateY(-34px) rotate(0deg);box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:2}
.turntable{display:none;margin-top:34px;gap:32px;align-items:flex-start}
.turntable.open{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.turntable .note{font-family:var(--display);font-size:clamp(22px,2.4vw,27px);font-style:italic;line-height:1.35}
.player{position:relative}
.player iframe{width:100%;max-width:660px;height:0;border:0;border-radius:10px;background:transparent;opacity:0;transition:opacity .4s}
.player iframe.ready{opacity:1;height:450px}
.player .loading{color:var(--mute);font-style:italic}
.player.failed .loading,.player iframe.ready~.loading{display:none}
.player .fallback{display:none;align-items:flex-start;color:var(--mute);font-style:italic;max-width:40ch}
.player.failed .fallback{display:flex}
.player.failed iframe{display:none}
.open-link{display:inline-block;margin-top:10px;font-style:italic}

/* ---------- shelf ---------- */
.shelf{display:flex;align-items:flex-end;gap:22px;padding:24px 14px 0;min-height:200px;overflow-x:auto;scrollbar-width:thin;
  border-bottom:10px solid var(--line);transition:border-color var(--t);position:relative}
.shelf::after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:14px;background:linear-gradient(rgba(0,0,0,.35),transparent)}
.cover{flex:0 0 auto;position:relative;transform-origin:50% 100%;transition:transform .3s;border-radius:2px;
  box-shadow:-5px 6px 16px rgba(0,0,0,.45);background:hsl(var(--h) var(--sleeve-sat) var(--sleeve-lum));overflow:hidden;text-align:left}
.cover.book{width:124px;height:182px}
.cover.video{width:230px;height:130px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .plain{position:absolute;inset:0;padding:12px 12px 36px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 50%,rgba(0,0,0,.25))}
.cover .plain .t{font-size:17px;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.cover .plain .by{font-size:12px;font-style:italic;opacity:.8}
.cover.book::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:rgba(0,0,0,.35);z-index:1}
.cover.video::after{content:"";position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;
  background:rgba(0,0,0,.55);box-shadow:0 0 0 1.5px rgba(255,255,255,.7) inset;
  -webkit-mask:radial-gradient(circle,#000 0 100%);}
.cover.video .play{position:absolute;left:50%;top:50%;transform:translate(-45%,-50%);width:0;height:0;z-index:2;
  border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.cover:hover,.cover:focus-visible{transform:translateY(-10px) rotate(-1deg)}
.cover[aria-pressed="true"]{transform:translateY(-18px);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.status{position:absolute;right:0;bottom:12px;z-index:2;font-size:12px;font-style:italic;padding:2px 8px 3px;
  background:var(--bg);color:var(--ink);border-radius:3px 0 0 3px;transition:background var(--t),color var(--t)}
.pulled{display:none;margin-top:44px;gap:32px;align-items:flex-start}
.pulled.open{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
.pulled h3{font-family:var(--display);font-size:clamp(22px,2.4vw,28px);font-weight:400;margin:0 0 4px}
.pulled .note{font-family:var(--display);font-style:italic;font-size:clamp(21px,2.2vw,25px);line-height:1.4;margin-top:12px}
.yt{position:relative;width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.3)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mute);font-style:italic;text-align:center;padding:20px}
.yt.failed .fallback{display:flex}
.yt.failed iframe{display:none}
@media (max-width:720px){.pulled.open{grid-template-columns:1fr}}

/* ---------- closet ---------- */
.rail{border-top:5px solid var(--line);transition:border-color var(--t);display:flex;gap:clamp(18px,4vw,44px);padding:0 10px;overflow-x:auto;scrollbar-width:thin}
.hanger{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;width:150px;padding-top:0;transition:transform .3s;transform-origin:50% 0}
.hanger svg{width:120px;height:auto;display:block;overflow:visible}
.hanger .hook,.hanger .arm{fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke var(--t)}
.hanger .garment{fill:hsl(var(--h) var(--sleeve-sat) var(--sleeve-lum));transition:fill var(--t)}
.hanger .photo{width:120px;height:150px;object-fit:cover;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.4);margin-top:-6px}
.hanger .tag{margin-top:12px;font-size:15px;line-height:1.2;text-align:center}
.hanger .tag small{display:block;font-style:italic;color:var(--mute);font-size:13px;margin-top:3px;transition:color var(--t)}
.hanger:hover,.hanger:focus-visible{transform:rotate(-3deg)}
.hanger[aria-pressed="true"]{transform:translateY(8px)}
.fitting{display:none;margin-top:40px;gap:32px;align-items:flex-start}
.fitting.open{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.fitting img{width:100%;max-width:380px;border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.fitting .nophoto{aspect-ratio:3/4;max-width:300px;border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;
  color:var(--mute);font-style:italic;text-align:center;padding:20px;transition:border-color var(--t),color var(--t)}
.fitting .note{font-family:var(--display);font-size:clamp(22px,2.4vw,27px);font-style:italic;line-height:1.35}


/* ---------- globe ---------- */
.globe-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.globe-stage{position:relative;aspect-ratio:1;max-width:520px;width:100%;margin:0 auto;touch-action:none}
.globe-stage canvas{width:100%;height:100%;display:block;cursor:grab;border-radius:50%}
.globe-stage.dragging canvas{cursor:grabbing}
.globe-stage .stand{position:absolute;left:50%;bottom:-26px;width:46%;height:16px;transform:translateX(-50%);
  border-bottom:4px solid var(--line);border-left:4px solid var(--line);border-right:4px solid var(--line);
  border-radius:0 0 40% 40%/0 0 100% 100%;transition:border-color var(--t)}
.pins{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:18px;font-style:italic}
.pins button{text-decoration:underline;text-decoration-color:var(--mute);text-underline-offset:.18em}
.pins button[aria-pressed="true"]{text-decoration-color:var(--glow)}
.postcard{min-height:200px}
.postcard h3{font-family:var(--display);font-size:clamp(24px,2.6vw,32px);font-weight:400;margin:0 0 2px}
.postcard .note{font-family:var(--display);font-style:italic;font-size:clamp(20px,2vw,24px);line-height:1.4;margin:12px 0 18px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photos img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.photos .nophoto{aspect-ratio:4/5;border:1px dashed var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:14px;color:var(--mute);font-style:italic;font-size:14px;transition:border-color var(--t),color var(--t)}
.postcard .idle{color:var(--mute);font-style:italic;transition:color var(--t)}
@media (max-width:820px){.globe-wrap{grid-template-columns:1fr}.globe-stage{max-width:380px}}


/* ---------- room ---------- */
.room-wrap{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;scrollbar-width:none}
.room-wrap::-webkit-scrollbar{display:none}
.room{position:absolute;left:0;top:0}
.room svg{width:100%;height:100%;display:block}
.room .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity var(--t)}
.room .photo.show{opacity:1}
.hot{cursor:pointer}
.hot .label{opacity:0;transition:opacity .25s;pointer-events:none;font-style:italic;font-size:22px;fill:var(--ink);font-family:var(--display)}
.hot:hover .label,.hot:focus-visible .label{opacity:1}
.hot:hover .lift,.hot:focus-visible .lift{transform:translateY(-6px)}
.hot .lift{transition:transform .3s}
.hot:focus,.hot:focus-visible{outline:none}
.hot:focus-visible .focusring{stroke:var(--glow);stroke-width:2;fill:none}
.focusring{stroke:none;fill:none}
.wall{fill:var(--wall);transition:fill var(--t)}
.floor{fill:var(--floor);transition:fill var(--t)}
.wood{fill:var(--wood);transition:fill var(--t)}
.wood-dk{fill:var(--wood-dk);transition:fill var(--t)}
.trim{fill:var(--trim);transition:fill var(--t)}
.sky{fill:var(--sky);transition:fill var(--t)}
.ink-line{stroke:var(--mute);fill:none;stroke-width:1.5;transition:stroke var(--t)}
.pool{opacity:0;transition:opacity var(--t)}
html.lit .pool{opacity:1}
.shade{opacity:.55;transition:opacity var(--t);pointer-events:none}
.pool{pointer-events:none}
html.lit .shade{opacity:.25}
:root{--wall:#141b2d;--floor:#0b0f1b;--wood:#1f2740;--wood-dk:#161d31;--trim:#2a3553;--sky:#1a2a55}
html.lit{--wall:#4a2418;--floor:#3a1410;--wood:#5a3a22;--wood-dk:#3a2314;--trim:#7a4a2a;--sky:#263454}













/* ---------- photo hotspots ---------- */
.spots{position:absolute;inset:0;display:none}
.room.photo-mode .spots{display:block}
.room.photo-mode svg{display:none}
.spot{position:absolute;border-radius:14px;cursor:pointer;background:transparent;transition:box-shadow .3s,background .3s}
.spot:focus-visible{box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.spot .tag{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-8px);white-space:nowrap;font-family:var(--text);font-weight:400;letter-spacing:.02em;font-size:17px;color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,.8);opacity:0;transition:opacity .25s;pointer-events:none}
.spot:hover .tag,.spot:focus-visible .tag,.spot .tag.intro{opacity:1}
.spot .tag{transition:opacity .7s}
.spot-shelf .tag,.spot-turntable .tag{bottom:auto;top:100%;transform:translate(-50%,8px)}




/* ---------- zoom into the globe ---------- */
.room{transition:transform 1.1s cubic-bezier(.4,0,.2,1),opacity .9s ease .15s;will-change:transform}
.room.zoomed{transform:scale(2.6);opacity:0;pointer-events:none}
.dock{transition:opacity .5s}
.room-wrap.away .dock{opacity:0;pointer-events:none}
.drawer.full .panel{width:100%;border-radius:0;box-shadow:none;background:radial-gradient(ellipse 70% 60% at 50% 40%,var(--bg-2),var(--bg))}
.drawer.full .scrim{background:transparent;backdrop-filter:none}
.drawer.full #globe .globe-wrap{max-width:1240px;margin:0 auto;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.drawer.full #globe .globe-stage{max-width:640px}
@media (prefers-reduced-motion:reduce){.room{transition:none}}


.essay{max-width:62ch;margin-top:32px}.essay h4{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 2px}.essay .sub{color:var(--mute);font-style:italic;margin-bottom:12px}
.essay p{margin:0 0 1em}
.reflection{max-width:62ch;margin-top:22px;padding-left:14px;border-left:2px solid var(--line)}.reflection .d{color:var(--mute);font-size:14px}
.photos figure{margin:0}.photos figcaption{font-size:13px;color:var(--mute);margin-top:4px}


/* ---------- content standing on the photo shelves ---------- */
.shelf-objects{position:absolute;inset:0;pointer-events:none;display:none}
.room.photo-mode .shelf-objects{display:block}
.shelf-row{position:absolute;display:flex;align-items:flex-end;gap:1.2%;padding:0 1.5%}
.so{position:relative;flex:0 0 auto;border-radius:1px;overflow:hidden;background:hsl(var(--h) 30% 30%);
  box-shadow:-3px 4px 10px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);transform:rotate(var(--r,0deg));transform-origin:50% 100%}
.so img{width:100%;height:100%;object-fit:cover;display:block}
.so::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,170,80,.18),transparent 40%,rgba(0,0,0,.35));transition:opacity var(--t)}
html:not(.lit) .so{filter:brightness(.38) saturate(.5) sepia(.1) hue-rotate(190deg)}
.so .pt{position:absolute;inset:0;padding:6% 8%;font-size:var(--fs,11px);line-height:1.15;color:#f3e6d0;text-shadow:0 1px 2px rgba(0,0,0,.6);display:flex;flex-direction:column;justify-content:flex-end}


/* ---------- dock: the little bit of text over the room ---------- */
html,body{height:100%;overscroll-behavior:none}
body{overflow:hidden}
.room-wrap{height:var(--vh,100dvh);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.room img{-webkit-user-drag:none;user-drag:none}
button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.dock{position:absolute;inset:0;z-index:6;pointer-events:none;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.9)}
.dock > *{pointer-events:auto}
.room-hint{position:absolute;left:0;right:0;bottom:56px;margin:0;text-align:center;font-family:var(--display);font-style:italic;font-size:18px;opacity:.85;pointer-events:none;transition:opacity .6s}
.room-hint:empty{opacity:0}
.room-index{position:absolute;right:clamp(18px,3vw,40px);bottom:18px;display:flex;gap:4px 18px;font-size:14px;letter-spacing:.04em}
.room-index button{color:#fff;opacity:.75;padding:6px 0}
.room-index button:hover,.room-index button:focus-visible{opacity:1}
.overlay-head{position:absolute;left:clamp(18px,3vw,40px);bottom:18px;display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap;max-width:62%}
.overlay-head h1{margin:0;font-family:var(--text);font-weight:500;font-size:15px;letter-spacing:.14em;text-transform:lowercase}
.overlay-head .lede{margin:0;font-family:var(--display);font-style:italic;font-size:17px;opacity:.85}
.overlay-head .links{display:flex;gap:14px;font-size:13px;letter-spacing:.04em;opacity:.8}
.overlay-head .links a{text-decoration:none;padding:6px 0}
.overlay-head .links a:hover{text-decoration:underline;text-underline-offset:.2em}
.ambient{display:none;font-size:13px;letter-spacing:.04em;opacity:.7;padding:6px 0;color:#fff}
.ambient.has{display:inline-block}.ambient:hover{opacity:1}
.room-wrap.show-tags .spot .tag{opacity:1}
.spot{-webkit-tap-highlight-color:transparent}

/* phones and narrow windows: stack the dock over a soft fade at the bottom */
@media (max-width:760px), (orientation:portrait) and (max-width:1024px){
  .dock{inset:auto 0 0 0;display:flex;flex-direction:column;align-items:center;gap:10px;
    padding:56px 18px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,rgba(6,6,10,.82),rgba(6,6,10,.55) 60%,transparent)}
  .room-hint,.room-index,.overlay-head{position:static}
  .room-hint{font-size:17px;min-height:1.4em}
  .room-index{justify-content:center;gap:0;font-size:15px}
  .room-index button{padding:10px 14px;opacity:.9}
  .overlay-head{max-width:none;justify-content:center;text-align:center;gap:2px 14px}
  .overlay-head h1{width:100%;font-size:13px}
  .overlay-head .lede{width:100%;font-size:16px}
  .overlay-head .links{gap:16px}
  .overlay-head .links a,.ambient{padding:8px 0}
  .spot .tag{font-size:15px}
  .drawer .panel{border-radius:0}
}


/* ---------- globe view ---------- */
.drawer.full #globe .globe-wrap{display:block;max-width:none}
.globe-col{display:flex;flex-direction:column;align-items:center}
.drawer.full #globe .globe-stage{max-width:min(620px,82vw,62vh)}
#globe > .prose{text-align:center;margin:0 auto}
.pins{justify-content:center;margin-top:26px;font-style:normal;font-size:14px;letter-spacing:.04em}
.pins button{padding:6px 2px}
.pin-tip{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;font-size:13px;letter-spacing:.03em;
  padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;opacity:0;transition:opacity .2s}
.pin-tip.on{opacity:1}
#globe-msg:empty{display:none}

/* ---------- destination journal ---------- */
.journal{position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--ink);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s,background-color var(--t),color var(--t)}
.journal.open{opacity:1;visibility:visible;transition:opacity .5s ease,background-color var(--t),color var(--t)}
.j-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;gap:16px;padding:16px clamp(18px,4vw,48px) 22px;
  font-size:14px;letter-spacing:.04em;background:linear-gradient(var(--bg) 55%,transparent);transition:background var(--t)}
.j-bar button{padding:6px 0;opacity:.8}.j-bar button:hover,.j-bar button:focus-visible{opacity:1}
.j-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,88px);align-items:end;max-width:1240px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}
.j-head.textonly{grid-template-columns:minmax(0,1fr);max-width:760px;padding-top:12vh}
.j-lead{margin:0}
.j-lead button{display:block;width:100%;padding:0;cursor:zoom-in}
.j-lead img{display:block;width:100%;height:min(80vh,820px);object-fit:cover;background:var(--bg-2)}
.j-text{padding-bottom:1vh}
.j-text h2{font-family:var(--display);font-weight:400;font-size:clamp(52px,7.5vw,112px);line-height:.92;letter-spacing:-.01em;margin:0 0 16px}
.j-meta{margin:0 0 30px;font-size:14px;letter-spacing:.06em;color:var(--mute);transition:color var(--t)}
.j-note{font-size:clamp(18px,1.45vw,20px);line-height:1.75;max-width:44ch}
.j-note p{margin:0 0 1em}
.j-empty{color:var(--mute);font-style:italic}
.j-gallery{max-width:1240px;margin:clamp(72px,11vw,150px) auto 0;padding:0 clamp(18px,4vw,48px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(22px,3vw,40px) clamp(14px,2vw,26px);align-items:start}
.j-gallery figure{margin:0}
.j-gallery button{display:block;width:100%;padding:0;cursor:zoom-in}
.j-gallery img{display:block;width:100%;height:auto;background:var(--bg-2)}
.j-gallery figcaption,.j-lead figcaption{margin-top:9px;font-size:13px;letter-spacing:.02em;color:var(--mute);transition:color var(--t)}
.j-writing{max-width:62ch;margin:clamp(72px,10vw,130px) auto 0;padding:0 clamp(18px,4vw,48px)}
.j-writing h3{font-family:var(--display);font-weight:400;font-size:clamp(30px,3.4vw,42px);line-height:1.1;margin:0 0 6px}
.j-writing .sub{color:var(--mute);font-size:14px;letter-spacing:.04em;margin-bottom:22px}
.j-writing p{font-size:19px;line-height:1.75;margin:0 0 1.1em}
.j-writing article+article,.j-writing .reflection{margin-top:64px}
.j-foot{display:flex;justify-content:center;gap:32px;padding:clamp(80px,12vw,160px) 18px 64px;font-size:14px;letter-spacing:.04em}
.j-foot button{padding:8px 0;opacity:.75;text-decoration:underline;text-underline-offset:.25em;text-decoration-color:var(--mute)}
.j-foot button:hover{opacity:1}
@media (max-width:760px){
  .j-head{grid-template-columns:minmax(0,1fr);gap:28px;padding:0}
  .j-lead img{height:auto;aspect-ratio:3/4;max-height:78vh}
  .j-lead figcaption{padding:0 18px}
  .j-text{padding:0 18px}
  .j-gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 10px;padding:0 10px}
  .j-gallery figcaption{font-size:12px;margin-top:6px}
}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;z-index:40;background:#060608;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;touch-action:pan-y}
.lightbox.open{opacity:1;visibility:visible;transition:opacity .3s}
.lb-fig{margin:0;display:flex;flex-direction:column;align-items:center;max-width:100vw}
.lb-fig img{display:block;max-width:94vw;max-height:84vh;max-height:calc(var(--vh,100dvh) * .84);object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb-fig figcaption{margin-top:12px;color:#d8d2c8;font-size:14px;letter-spacing:.02em;min-height:1.3em;text-align:center;padding:0 18px}
.lb-close{position:absolute;top:14px;right:clamp(14px,3vw,32px);color:#fff;font-size:14px;letter-spacing:.04em;padding:10px 4px;opacity:.85}
.lb-count{position:absolute;top:24px;left:clamp(14px,3vw,32px);color:#fff;opacity:.55;font-size:13px;letter-spacing:.06em}
.lb-prev,.lb-next{position:absolute;top:0;bottom:0;width:22vw;max-width:220px;cursor:pointer}
.lb-prev{left:0;cursor:w-resize}.lb-next{right:0;cursor:e-resize}
.lb-prev:focus-visible,.lb-next:focus-visible{outline-offset:-6px}


/* ---------- deck: the player that keeps going while you look around ---------- */
.deck{position:fixed;z-index:35;right:clamp(12px,2vw,24px);bottom:clamp(12px,2vw,24px);width:min(380px,calc(100vw - 24px));
  background:rgba(14,12,12,.92);color:#f3ece2;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}
.deck[hidden],.deck [hidden]{display:none !important}
.deck-bar{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;min-height:52px}
.deck-meta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.deck-title{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-sub{font-size:12px;letter-spacing:.03em;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck-btn{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#f3ece2}
.deck-btn svg{width:20px;height:20px;fill:currentColor}
.deck-play{background:rgba(255,255,255,.1)}
.deck-play .i-pause{display:none}.deck.playing .deck-play .i-pause{display:block}.deck.playing .deck-play .i-play{display:none}
.deck-text{flex:0 0 auto;font-size:13px;letter-spacing:.04em;opacity:.7;padding:8px 2px}
.deck-text:hover,.deck-btn:hover{opacity:1}
.deck-progress{height:3px;background:rgba(255,255,255,.12);cursor:pointer;margin:0 14px 10px}
.deck-progress div{height:100%;width:0;background:#E0A44A}
.deck-embed iframe{display:block;width:100%;height:175px;border:0;background:transparent}
.deck.min .deck-embed{position:absolute;left:-10000px;top:0;width:360px}
.deck-note{font-size:12px;opacity:.55;padding:0 14px 10px;margin:0}
.deck.min .deck-note{display:none}
@media (max-width:760px){
  .deck{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));width:auto}
  html.deck-on .dock{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
}
.play-record{display:inline-block;margin-top:18px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;font-size:14px;letter-spacing:.04em;transition:border-color .2s}
.play-record:hover,.play-record:focus-visible{border-color:var(--glow)}

/* ---------- drawer ---------- */
.drawer{position:fixed;inset:0;z-index:20;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);border-radius:28px 0 0 28px;color:var(--ink);overflow-y:auto;
  padding:28px clamp(20px,4vw,48px) 60px;box-shadow:-20px 0 60px rgba(0,0,0,.5);transition:background-color var(--t)}
.drawer .close{position:sticky;top:0;float:right;font-style:italic;padding:6px 0;z-index:2;background:var(--bg);transition:background-color var(--t)}
.drawer section{margin-top:12px;display:none}
.drawer section.show{display:block}
@media (prefers-reduced-motion:no-preference){.drawer.open .panel{animation:slide .4s cubic-bezier(.2,.8,.2,1)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}

/* ---------- footer ---------- */
footer{margin-top:clamp(80px,12vw,140px);color:var(--mute);font-style:italic;transition:color var(--t);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.empty{color:var(--mute);font-style:italic;padding:24px 0}

/* ---------- small screens ---------- */
@media (max-width:720px){
  .turntable.open,.fitting.open{grid-template-columns:1fr}
  .player iframe{height:450px}
  .sleeve{width:150px;height:150px;margin-left:-26px}
  .shelf{min-height:170px}
}
</style>

    }
    // hover a pin to see its name (mouse); a tap goes straight in
    const tip = $('#pin-tip');
    function nearest(mx, my, within){
      let best = null, bd = within;
      places.forEach(p => { if(d3.geoDistance([p.lon,p.lat],[-rot[0],-rot[1]]) > Math.PI/2) return; const [x,y] = proj([p.lon,p.lat]); const d = Math.hypot(x-mx, y-my); if(d < bd){ bd = d; best = p; } });
      return best;
    }
    stage.addEventListener('pointermove', e => {
      if(drag || e.pointerType !== 'mouse') return;
      const r = canvas.getBoundingClientRect(), p = nearest(e.clientX-r.left, e.clientY-r.top, 14);
      if(p){ const [x,y] = proj([p.lon,p.lat]); tip.textContent = [p.name, p.subtitle || p.country].filter(Boolean).join(', '); tip.style.left = x+'px'; tip.style.top = y+'px'; tip.classList.add('on'); stage.style.cursor = 'pointer'; }
      else { tip.classList.remove('on'); stage.style.cursor = ''; }
    });
    stage.addEventListener('pointerleave', () => tip.classList.remove('on'));
    places.forEach(p => { const b = document.createElement('button'); b.textContent = p.name; b.dataset.n = p.name; b.setAttribute('aria-pressed','false'); b.addEventListener('click', () => show(p)); pinsNav.appendChild(b); });
    new ResizeObserver(resize).observe(stage); resize();
    const fromLink = location.hash && places.find(p => p.id && '#'+p.id === location.hash);
    if(fromLink){ setLit(true, true); openDrawer('globe'); active = fromLink; rot = [-fromLink.lon, -fromLink.lat*0.6]; spinning = false; setTimeout(() => openJournal(fromLink, true), 700); }
  })();
})();
</script>
</body>
